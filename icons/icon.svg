<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Colonist Card Tracker: a Catan hex holding two resource cards and the probability sign.
       Artwork occupies 96px inside a 128px canvas (Chrome Web Store 16px margin rule). -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9ad9"/>
      <stop offset="1" stop-color="#1f5f9f"/>
    </linearGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c33c"/>
      <stop offset="1" stop-color="#d99a12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- hex (pointy top), 96px tall -->
  <polygon points="64,16 105.6,40 105.6,88 64,112 22.4,88 22.4,40" fill="url(#sea)" stroke="#123f6e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="64,24 98.6,44 98.6,84 64,104 29.4,84 29.4,44" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linejoin="round"/>
  <!-- back card: grain -->
  <g transform="rotate(-14 62 68)" filter="url(#shadow)">
    <rect x="36" y="38" width="38" height="52" rx="4.5" fill="url(#grain)" stroke="#fff" stroke-width="3"/>
    <path d="M55 80 V52" stroke="#7a4d00" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="51" cy="57" rx="4" ry="2.4" fill="#fff3c4" transform="rotate(-35 51 57)"/>
    <ellipse cx="59" cy="57" rx="4" ry="2.4" fill="#fff3c4" transform="rotate(35 59 57)"/>
    <ellipse cx="50.6" cy="64" rx="4" ry="2.4" fill="#fff3c4" transform="rotate(-35 50.6 64)"/>
    <ellipse cx="59.4" cy="64" rx="4" ry="2.4" fill="#fff3c4" transform="rotate(35 59.4 64)"/>
  </g>
  <!-- front card: lumber with the % sign -->
  <g transform="rotate(10 72 74)" filter="url(#shadow)">
    <rect x="52" y="44" width="40" height="54" rx="4.5" fill="url(#wood)" stroke="#fff" stroke-width="3"/>
    <text x="72" y="83" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">%</text>
  </g>
</svg>
